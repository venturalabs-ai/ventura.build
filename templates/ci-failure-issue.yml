name: Autonomous Failure Issue

on:
  workflow_run:
    workflows:
      - CI
      - Repository Health
      - Security
      - Ventura Repository Security Baseline
      - Ventura Production Standard
      - Ventura Autonomy Gate
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Create or update deduplicated failure issue
        shell: bash
        run: |
          set -euo pipefail
          TITLE="[automation] ${WORKFLOW_NAME} failing"
          BODY=$(printf 'Automated CI health signal.\n\n- Workflow: `%s`\n- Conclusion: `%s`\n- Commit: `%s`\n- Run: %s\n\nClose this issue after the workflow is green again.' "$WORKFLOW_NAME" "$CONCLUSION" "$HEAD_SHA" "$RUN_URL")
          NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1 || true)
          if [ -n "$NUMBER" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" --method POST -f body="$BODY" >/dev/null
            echo "Updated issue #${NUMBER}"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues" --method POST -f title="$TITLE" -f body="$BODY" >/dev/null
            echo "Created failure issue"
          fi
