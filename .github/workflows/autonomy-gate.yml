name: Ventura Autonomy Gate

on:
  workflow_call:
    inputs:
      require_profile:
        description: Require and validate .ventura/repo-profile.json
        required: false
        type: boolean
        default: true
      run_python_tests:
        description: Run repository-specific Python tests after policy checks
        required: false
        type: boolean
        default: false
      test_command:
        description: Python test command used when run_python_tests is true
        required: false
        type: string
        default: python -m unittest discover -s tests -v

permissions:
  contents: read

jobs:
  autonomy-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject decorative test scaffolds
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --exclude-dir=.git --exclude='*.md' 'Adicione mais validações específicas aqui' tests 2>/dev/null; then
            echo '::error::Decorative structure-only scaffold detected. Replace it with domain behavior tests.'
            exit 1
          fi

      - name: Require immutable GitHub Action refs
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          root = Path('.github/workflows')
          errors = []
          pattern = re.compile(r'^\s*-?\s*uses:\s*([^\s#]+)')
          sha = re.compile(r'^[0-9a-fA-F]{40}$')
          if root.exists():
              for path in sorted(list(root.glob('*.yml')) + list(root.glob('*.yaml'))):
                  for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      match = pattern.match(line)
                      if not match:
                          continue
                      target = match.group(1)
                      if target.startswith('./') or target.startswith('docker://'):
                          continue
                      if '@' not in target:
                          errors.append(f'{path}:{line_no}: action without ref: {target}')
                          continue
                      ref = target.rsplit('@', 1)[1]
                      if not sha.fullmatch(ref):
                          errors.append(f'{path}:{line_no}: non-immutable ref: {target}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All external GitHub Actions/reusable workflows are pinned to full SHAs.')

      - name: Validate repository control profile
        if: ${{ inputs.require_profile }}
        shell: python
        run: |
          import json
          from pathlib import Path
          import sys

          roles = {
              'orchestrator', 'engineering_platform', 'security', 'agent_catalog',
              'provider_catalog', 'shared_sdk', 'optimizer', 'roadmap', 'knowledge',
              'discovery', 'curation', 'domain_product', 'experimental_domain'
          }
          budgets = {'simple', 'normal', 'critical'}
          context_strategies = {'semantic_ast', 'semantic', 'diff_first'}
          autonomy = {'high', 'guarded', 'curation'}
          path = Path('.ventura/repo-profile.json')
          errors = []
          if not path.is_file():
              errors.append('missing .ventura/repo-profile.json')
              data = {}
          else:
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f'invalid repository profile: {exc}')
                  data = {}
          if data.get('schema_version') != 1:
              errors.append('schema_version must be 1')
          if data.get('repository_role') not in roles:
              errors.append('invalid repository_role')
          if data.get('autonomy') not in autonomy:
              errors.append('invalid autonomy')
          if data.get('budget_profile') not in budgets:
              errors.append('invalid budget_profile')
          context = data.get('context') or {}
          if context.get('strategy') not in context_strategies:
              errors.append('invalid context.strategy')
          if not isinstance(context.get('max_files'), int) or not 1 <= context.get('max_files', 0) <= 50:
              errors.append('context.max_files must be 1..50')
          if not isinstance(context.get('max_chars'), int) or not 1000 <= context.get('max_chars', 0) <= 100000:
              errors.append('context.max_chars must be 1000..100000')
          routing = data.get('routing') or {}
          if not isinstance(routing.get('enabled'), bool):
              errors.append('routing.enabled must be boolean')
          if not isinstance(routing.get('champion_challenger'), bool):
              errors.append('routing.champion_challenger must be boolean')
          required = (data.get('validation') or {}).get('required')
          if not isinstance(required, list) or not required or not all(isinstance(v, str) and v for v in required):
              errors.append('validation.required must be a non-empty string list')
          hard_gates = (data.get('security') or {}).get('hard_gates')
          if not isinstance(hard_gates, list) or not hard_gates or not all(isinstance(v, str) and v for v in hard_gates):
              errors.append('security.hard_gates must be a non-empty string list')
          if errors:
              print('\n'.join(f'PROFILE ERROR: {error}' for error in errors))
              sys.exit(1)
          print(f"PROFILE OK: role={data['repository_role']} budget={data['budget_profile']} context={context['strategy']}")

      - name: Validate repository evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          find . -maxdepth 1 -type f -iname 'LICENSE*' -print -quit | grep -q .
          git diff --check

  python-tests:
    if: ${{ inputs.run_python_tests }}
    needs: autonomy-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Run repository tests
        shell: bash
        run: ${{ inputs.test_command }}
