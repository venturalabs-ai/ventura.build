name: Ventura Repository Security Baseline

on:
  workflow_call:

concurrency:
  group: ventura-standard-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          find . -maxdepth 1 -type f -iname 'LICENSE*' -print -quit | grep -q . || {
            echo '::error::Repository must contain a LICENSE file.'
            exit 1
          }
          git diff --check
          if git grep -nE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' -- ':!*.lock'; then
            echo '::error::Merge conflict markers detected.'
            exit 1
          fi

      - name: Validate structural integrity
        shell: python
        run: |
          from pathlib import Path
          import json
          import py_compile
          import sys
          import tomllib

          root = Path('.')
          ignored = {'.git', 'node_modules', '.venv', 'venv', 'dist', 'build', 'coverage', '.next', '.cache'}
          errors = []
          warnings = []
          seen_casefold = {}

          def skip(path: Path) -> bool:
              return any(part in ignored for part in path.parts)

          files = [p for p in root.rglob('*') if p.is_file() and not skip(p)]

          for path in files:
              rel = path.as_posix()
              folded = rel.casefold()
              previous = seen_casefold.get(folded)
              if previous and previous != rel:
                  errors.append(f'case-colliding paths: {previous} and {rel}')
              seen_casefold[folded] = rel

              try:
                  if path.is_symlink():
                      target = path.resolve()
                      if root.resolve() not in target.parents and target != root.resolve():
                          errors.append(f'{rel}: symlink escapes repository')
                  if path.stat().st_size > 20 * 1024 * 1024:
                      warnings.append(f'{rel}: file larger than 20 MiB; verify Git LFS or artifact storage')
              except OSError as exc:
                  errors.append(f'{rel}: filesystem error: {exc}')

              try:
                  if path.suffix == '.json':
                      json.loads(path.read_text(encoding='utf-8'))
                  elif path.suffix == '.toml':
                      tomllib.loads(path.read_text(encoding='utf-8'))
                  elif path.suffix == '.py':
                      py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  errors.append(f'{rel}: parse/compile failure: {exc}')

          package_json = root / 'package.json'
          if package_json.exists() and not any((root / name).exists() for name in ('package-lock.json', 'npm-shrinkwrap.json', 'pnpm-lock.yaml', 'yarn.lock', 'bun.lock', 'bun.lockb')):
              errors.append('package.json exists without a JavaScript package-manager lockfile')

          python_files = [p for p in files if p.suffix == '.py' and '.github' not in p.parts]
          test_files = [p for p in files if ('test' in p.name.lower() or 'tests' in p.parts) and p.suffix in {'.py', '.js', '.jsx', '.ts', '.tsx', '.go', '.rs'}]
          if len(python_files) >= 10 and not test_files:
              warnings.append(f'{len(python_files)} Python files detected but no test files found')

          for warning in warnings:
              print(f'::warning::{warning}')
          if errors:
              print('Structural integrity validation failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)
          print(f'Validated structural integrity for {len(files)} files.')

      - name: Audit GitHub Actions security
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          workflow_root = Path('.github/workflows')
          if not workflow_root.exists():
              print('No workflow directory found; skipping workflow security audit.')
              raise SystemExit(0)

          errors = []
          warnings = []
          sha_ref = re.compile(r'^[0-9a-fA-F]{40}$')
          uses_re = re.compile(r'^\s*-?\s*uses:\s*([^\s#]+)')

          for path in sorted(list(workflow_root.glob('*.yml')) + list(workflow_root.glob('*.yaml'))):
              text = path.read_text(encoding='utf-8')
              rel = path.as_posix()

              if re.search(r'^\s*pull_request_target\s*:', text, re.MULTILINE):
                  errors.append(f'{rel}: pull_request_target is forbidden by the shared baseline; use an unprivileged pull_request workflow')
              if re.search(r'^\s*permissions\s*:\s*write-all\s*$', text, re.MULTILINE | re.IGNORECASE):
                  errors.append(f'{rel}: permissions write-all is forbidden')
              if re.search(r'\b(curl|wget)\b[^\n|]*\|\s*(bash|sh)\b', text, re.IGNORECASE):
                  errors.append(f'{rel}: remote script piped directly to a shell')

              for line in text.splitlines():
                  match = uses_re.match(line)
                  if not match:
                      continue
                  target = match.group(1)
                  if target.startswith('./') or target.startswith('docker://'):
                      continue
                  if '@' not in target:
                      errors.append(f'{rel}: action/reusable workflow without explicit ref: {target}')
                      continue
                  action, ref = target.rsplit('@', 1)
                  if action == 'venturalabs-ai/ventura.build/.github/workflows/repo-standard.yml':
                      if ref == 'main':
                          warnings.append(f'{rel}: shared Ventura workflow still uses mutable @main; pin the generated baseline SHA')
                      continue
                  if ref.lower() in {'main', 'master', 'latest', 'head'}:
                      errors.append(f'{rel}: mutable branch/latest action ref is forbidden: {target}')
                  elif not sha_ref.fullmatch(ref):
                      warnings.append(f'{rel}: {target} is tag-pinned but not immutable; prefer a verified full commit SHA')

          for warning in warnings:
              print(f'::warning::{warning}')
          if errors:
              print('GitHub Actions security audit failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)
          print(f'Workflow security audit passed with {len(warnings)} immutable-pin warning(s).')

      - name: Validate Agent Skills
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          root = Path('.github/skills')
          if not root.exists():
              print('No project Agent Skills found; skipping.')
              raise SystemExit(0)

          errors = []
          seen_names = set()
          seen_descriptions = {}
          skill_files = sorted(root.glob('*/SKILL.md'))

          if not skill_files:
              errors.append('.github/skills exists but contains no */SKILL.md files')

          for skill_file in skill_files:
              text = skill_file.read_text(encoding='utf-8')
              lines = text.splitlines()
              rel = skill_file.as_posix()

              if not lines or lines[0].strip() != '---':
                  errors.append(f'{rel}: missing opening YAML frontmatter delimiter')
                  continue

              try:
                  close = next(i for i, line in enumerate(lines[1:], start=1) if line.strip() == '---')
              except StopIteration:
                  errors.append(f'{rel}: missing closing YAML frontmatter delimiter')
                  continue

              frontmatter = lines[1:close]
              body = lines[close + 1:]
              fields = {}
              for line in frontmatter:
                  if ':' not in line:
                      continue
                  key, value = line.split(':', 1)
                  fields[key.strip()] = value.strip()

              name = fields.get('name', '')
              description = fields.get('description', '')
              folder = skill_file.parent.name

              if not (2 <= len(name) <= 64 and re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', name)):
                  errors.append(f'{rel}: invalid kebab-case name or length')
              if name != folder:
                  errors.append(f'{rel}: frontmatter name must equal folder name {folder}')
              if name in seen_names:
                  errors.append(f'{rel}: duplicate skill name {name}')
              seen_names.add(name)

              if not description:
                  errors.append(f'{rel}: description is required')
              else:
                  low = description.lower()
                  if ': ' in description:
                      errors.append(f'{rel}: description must not contain colon-space')
                  if '<' in description or '>' in description:
                      errors.append(f'{rel}: description must not contain angle brackets')
                  if 'use when' not in low:
                      errors.append(f'{rel}: description must state when to use')
                  if 'do not use when' not in low:
                      errors.append(f'{rel}: description must state when not to use')
                  if description in seen_descriptions:
                      errors.append(f'{rel}: duplicate description also used by {seen_descriptions[description]}')
                  seen_descriptions[description] = rel

              if not any(line.strip() for line in body):
                  errors.append(f'{rel}: Markdown body is empty')
              if len(body) > 200:
                  errors.append(f'{rel}: body exceeds 200 lines')

          if errors:
              print('Agent Skill validation failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)

          print(f'Validated {len(skill_files)} Agent Skill files.')

      - name: Validate Agent Connector Manifest
        shell: python
        run: |
          from pathlib import Path
          import json
          import sys

          skills_root = Path('.github/skills')
          manifest_path = Path('.github/agent/connectors.json')
          if not skills_root.exists():
              print('No project Agent Skills found; connector manifest optional.')
              raise SystemExit(0)
          if not manifest_path.exists():
              print('No connector manifest found; skipping connector routing validation.')
              raise SystemExit(0)

          errors = []
          try:
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'Invalid connector manifest JSON: {exc}')
              raise SystemExit(1)

          catalog = manifest.get('catalog', {})
          routes = manifest.get('routes', {})
          max_active = manifest.get('max_active_connectors_per_skill', 6)
          skill_names = {p.parent.name for p in skills_root.glob('*/SKILL.md')}

          if not isinstance(max_active, int) or not 1 <= max_active <= 8:
              errors.append('max_active_connectors_per_skill must be an integer between 1 and 8')
          if not isinstance(catalog, dict) or not catalog:
              errors.append('catalog must be a non-empty object')
          if not isinstance(routes, dict) or not routes:
              errors.append('routes must be a non-empty object')

          allowed_trust = {'official', 'native', 'local'}
          for name, spec in catalog.items():
              if not isinstance(spec, dict):
                  errors.append(f'catalog.{name} must be an object')
                  continue
              if spec.get('trust') not in allowed_trust:
                  errors.append(f'catalog.{name}.trust must be official native or local')
              if not spec.get('purpose'):
                  errors.append(f'catalog.{name}.purpose is required')

          routed_skills = set()
          for skill, connectors in routes.items():
              routed_skills.add(skill)
              if skill not in skill_names:
                  errors.append(f'route {skill} has no matching .github/skills/{skill}/SKILL.md')
              if not isinstance(connectors, list) or not connectors:
                  errors.append(f'route {skill} must contain at least one connector')
                  continue
              if len(connectors) > max_active:
                  errors.append(f'route {skill} exceeds max_active_connectors_per_skill={max_active}')
              if len(connectors) != len(set(connectors)):
                  errors.append(f'route {skill} contains duplicate connectors')
              for connector in connectors:
                  if connector not in catalog:
                      errors.append(f'route {skill} references unknown connector {connector}')

          required_routes = skill_names - {'connector-router'}
          missing_routes = sorted(required_routes - routed_skills)
          if missing_routes:
              errors.append('skills without connector routes: ' + ', '.join(missing_routes))

          if errors:
              print('Agent Connector Manifest validation failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)

          print(f'Validated {len(catalog)} connectors across {len(routes)} routed skills.')

      - name: Scan vulnerabilities, secrets and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          limit-severities-for-sarif: true
          timeout: 10m

      - name: Upload security findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SPDX SBOM
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: always() && hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.repository_id }}-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 14
          if-no-files-found: error
